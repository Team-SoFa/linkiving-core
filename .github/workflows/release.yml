name: 🚀 Linkiving backend release deploy 🚀

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (for example, v0.1.1)'
        required: true
        type: string
      allow_existing_tag_mismatch:
        description: 'Allow deploying the selected ref with an existing tag that points to another commit'
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: backend-production-release
  cancel-in-progress: false

jobs:
  build-release-notes:
    runs-on: ubuntu-latest

    steps:
      - name: ✨ Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: ✅ Validate release tag
        shell: bash
        env:
          TAG_NAME: ${{ env.RELEASE_TAG }}
          ALLOW_EXISTING_TAG_MISMATCH: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_existing_tag_mismatch || false }}
        run: |
          if [[ ! "${TAG_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG_NAME}" >&2
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/${TAG_NAME}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "${TAG_NAME}")"
            HEAD_SHA="$(git rev-parse HEAD)"

            if [ "${TAG_SHA}" != "${HEAD_SHA}" ]; then
              if [ "${ALLOW_EXISTING_TAG_MISMATCH}" != "true" ]; then
                echo "Tag ${TAG_NAME} already points to ${TAG_SHA}, not ${HEAD_SHA}." >&2
                exit 1
              fi

              echo "::warning::Deploying ${HEAD_SHA} with existing tag ${TAG_NAME}, which points to ${TAG_SHA}."
            fi
          fi

      - name: 📝 Build release notes from changelog
        shell: bash
        env:
          TAG_NAME: ${{ env.RELEASE_TAG }}
        run: |
          awk -v tag="${TAG_NAME}" '
            $0 == "## [" tag "]" || $0 ~ "^## \\[" tag "\\] " {
              capture = 1
              next
            }
            capture && (/^## \[/ || /^\[[^]]+\]: /) {
              exit
            }
            capture {
              print
            }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            {
              echo "Could not find release notes for ${TAG_NAME} in CHANGELOG.md."
              echo "Please add a ## [${TAG_NAME}] section before creating the tag."
            } >&2
            exit 1
          fi

      - name: 📦 Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  backend-docker-build-and-push:
    runs-on: ubuntu-latest
    needs: [ build-release-notes ]

    steps:
      - name: ✨ Checkout repository
        uses: actions/checkout@v5

      - name: ✨ JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ✨ Gradle caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🗂️ Make production config
        shell: bash
        env:
          APPLICATION: ${{ secrets.APPLICATION }}
        run: |
          mkdir -p ./src/main/resources
          printf '%s' "$APPLICATION" > ./src/main/resources/application.yml

      - name: ✨ Gradlew 권한 설정
        run: chmod +x ./gradlew

      - name: ✨ Jar 파일 빌드
        run: ./gradlew bootJar

      - name: ✨ DockerHub에 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: ✨ Docker image 빌드 후 DockerHub에 push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPOSITORY }}:${{ env.RELEASE_TAG }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/${{ secrets.DOCKER_HUB_REPOSITORY }}:latest

  backend-docker-pull-and-run:
    runs-on: [ self-hosted, prod ]
    needs: [ backend-docker-build-and-push ]
    if: ${{ needs.backend-docker-build-and-push.result == 'success' }}

    steps:
      - name: ✨ Checkout repository
        uses: actions/checkout@v5

      - name: 🗂️ Grafana 환경변수 설정
        run: |
          echo "GRAFANA_ADMIN_USER=admin" > ./docker/.env
          echo "GRAFANA_ADMIN_PASSWORD=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" >> ./docker/.env
        shell: bash

      - name: 🗂️ Alertmanager 알림 채널 설정
        shell: bash
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERTMANAGER_DISCORD_WEBHOOK_URL: ${{ secrets.AlERTMANAGER_DISCORD_WEBHOOK_URL }}
        run: |
          printf '%s' "$SMTP_PASSWORD" > ./docker/alerting/smtp_password
          chmod 600 ./docker/alerting/smtp_password
          printf '%s' "$ALERTMANAGER_DISCORD_WEBHOOK_URL" > ./docker/alerting/discord_webhook
          chmod 600 ./docker/alerting/discord_webhook

      - name: ✨ 배포 스크립트 실행
        env:
          IMAGE_TAG: ${{ env.RELEASE_TAG }}
          TRAFFIC_CHECK_URL: ${{ vars.TRAFFIC_CHECK_URL }}
          TRAFFIC_CHECK_HOST: ${{ vars.TRAFFIC_CHECK_HOST }}
        run: |
          chmod +x deploy.sh
          ./deploy.sh

  create-release:
    runs-on: ubuntu-latest
    needs: [ build-release-notes, backend-docker-pull-and-run ]
    if: ${{ needs.build-release-notes.result == 'success' && needs.backend-docker-pull-and-run.result == 'success' }}

    steps:
      - name: 📦 Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: 📝 Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
